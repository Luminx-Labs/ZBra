# === Clippy Configuration File ===

# --- Test code may unwrap/panic/print ---
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

avoid-breaking-exported-api = false

# --- Types banned across the workspace ---
disallowed-types = [
  { path = "std::collections::HashMap", reason = "use BTreeMap or indexmap::IndexMap" },
  { path = "std::collections::HashSet", reason = "use BTreeSet or indexmap::IndexSet" },
]
