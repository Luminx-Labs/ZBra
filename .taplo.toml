
include = ["**/*.toml"]
exclude = ["target/**", "node_modules/**", ".git/**", "dist/**", "build/**", ".venv/**", "CHANGELOG.md"]

# Global formatting options
[formatting]
align_entries = false
align_comments = true
array_trailing_comma = true
array_auto_expand = true
array_auto_collapse = true
compact_arrays = true
compact_inline_tables = false
compact_entries = false
column_width = 100
indent_tables = false
indent_entries = false
indent_string = "  "
trailing_newline = true
reorder_keys = false
reorder_arrays = false
reorder_inline_tables = false
allowed_blank_lines = 1
crlf = false

# Rust: keep dependency tables sorted alphabetically
[[rule]]
include = ["**/Cargo.toml"]
keys = [
  "dependencies",
  "dev-dependencies",
  "build-dependencies",
  "workspace.dependencies",
  "target.*.dependencies",
]

[rule.formatting]
reorder_keys = true

# Python: validate pyproject.toml and sort dependency arrays
[[rule]]
include = ["**/pyproject.toml"]
keys = ["project.dependencies", "project.optional-dependencies", "dependency-groups"]

[rule.formatting]
reorder_arrays = true
reorder_keys = true

# Lock files: leave untouched
[[rule]]
include = ["**/*.lock", "**/Cargo.lock", "**/poetry.lock", "**/uv.lock"]

[rule.formatting]
reorder_keys = false
reorder_arrays = false
