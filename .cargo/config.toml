[alias]
xtask = "run -p xtask --profile dev --quiet"
x = "xtask"
lint = "cargo clippy --workspace --all-features -- -D warnings"

[env]
# Keep every PyO3 build on the repository-managed Python environment. The
# repository's `.xtask.toml` pins the ABI this interpreter must provide.
PYO3_PYTHON = { value = ".venv/bin/python", relative = true, force = true }
