[alias]
xtask = "run -p xtask --profile dev --quiet"
x = "xtask"
lint = "cargo clippy --workspace --all-features -- -D warnings"

[env]
# Keep PyO3 builds on the repository-managed Python environment. `force = false`
# allows a developer or CI job to override this explicitly.
PYO3_PYTHON = { value = ".venv/bin/python", relative = true, force = false }
