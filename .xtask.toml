[project]
name = "zbra"

[paths]
python_dir = "nnue"
model_dir = "models"
data_dir = "data"
engine_binary = "target/release/zbra"
hooks_dir = ".githooks"

[python]
version = "3.12"
abi = "cp312"
implementation = "cpython"
package_manager = "uv"
project_dir = "."
virtual_environment = ".venv"
lockfile = "uv.lock"
required_tools = ["pytest", "ruff"]

[model]
default = "models/current.nnue"
format_version = 1
require_checksum = true