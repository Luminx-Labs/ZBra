# =============================================================================
# CI workflow
#
# Single sources of truth (nothing is duplicated in this file):
#   Rust version + components  rust-toolchain.toml
#   Python version             .python-version  (read by uv)
#   Python dependencies        uv.lock
#
# Jobs:
#   fmt       Fast checks (rustfmt, taplo, typos). Fails in seconds.
#   lint-test Clippy, tests (nextest) and docs. Runs only if `fmt` passes.
#   deny      Dependency policy, licenses and advisories (cargo-deny).
#   coverage  Coverage report. Runs on pushes to main only.
#   audit     RustSec advisory scan. Runs on a weekly schedule.
#
# Cargo tools are installed as prebuilt binaries via taiki-e/install-action,
# which is much faster than compiling them with cargo install.
# =============================================================================
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run (Monday 06:00 UTC) so new advisories are caught
    # even when there are no code changes.
    - cron: "0 6 * * 1"

# Cancel superseded runs on the same branch or PR to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: the workflow only needs to read the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Treat all compiler and rustdoc warnings as errors.
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Formatting and typo checks (cheap, so they run first)
  # ---------------------------------------------------------------------------
  fmt:
    name: Format and typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip on the weekly schedule; only the audit job is needed there.
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # rustfmt.toml uses nightly-only options. rust-toolchain.toml pins the
      # repo to a stable version, so plain `cargo fmt` would ignore them.
      # Nightly is installed separately and called with `cargo +nightly fmt`,
      # which overrides rust-toolchain.toml.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Install taplo and typos
        uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,typos-cli

      # -l lists only the files that need formatting instead of printing diffs.
      - name: Check Rust formatting
        run: cargo +nightly fmt --all -- --check -l

      - name: Check TOML formatting
        env:
          RUST_LOG: error
        run: taplo fmt --check --colors never

      - name: Check for typos
        run: typos

  # ---------------------------------------------------------------------------
  # Clippy, tests and documentation
  # ---------------------------------------------------------------------------
  lint-test:
    name: Lint and test
    needs: fmt # Don't spend time building if formatting already failed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Reads rust-toolchain.toml (channel, components, profile) and also
      # sets up dependency caching. The rustflags input is cleared because
      # RUSTFLAGS is already set globally above.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # uv picks the Python version from .python-version automatically.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # PyO3 build scripts need .venv/bin/python to exist before cargo runs.
      # Adjust the flags to match what your project needs, for example
      # `--all-packages` or `--all-groups`.
      - name: Create Python virtual environment
        run: uv sync --locked

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          .venv/bin/python --version

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      # nextest does not run doctests, so they are run separately.
      - name: Run tests
        run: cargo nextest run --workspace --all-features --locked

      - name: Run doctests
        run: cargo test --workspace --doc --all-features --locked

      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features --locked

  # ---------------------------------------------------------------------------
  # Dependency policy: licenses, bans, advisories and sources (deny.toml)
  # ---------------------------------------------------------------------------
  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check dependencies
        run: cargo deny check

  # ---------------------------------------------------------------------------
  # Coverage (main branch only, since instrumented builds are slow)
  # llvm-tools-preview is already listed in rust-toolchain.toml.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Create Python virtual environment
        run: uv sync --locked

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      # RUSTFLAGS is cleared here because -D warnings can conflict with the
      # coverage instrumentation flags.
      - name: Generate coverage report
        env:
          RUSTFLAGS: ""
        run: cargo llvm-cov nextest --workspace --all-features --locked --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  # ---------------------------------------------------------------------------
  # RustSec advisory scan (weekly or manual, because new advisories can appear
  # at any time and should not block unrelated pull requests)
  # ---------------------------------------------------------------------------
  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
