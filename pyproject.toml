[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zbra-nnue"
version = "0.2.0-alpha.0"
description = "NNUE training for the ZBra chess engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "zbra-dev",
  "optuna>=5.0",
  "numpy>=1.26,<3",
  "pydantic>=2.14,<3",
]

[project.optional-dependencies]
training = [
  "zbra_dev",
  "maturin>=1.7,<2",
  "pytest>=8,<9",
  "optuna>=5.0",
  "pydantic>=2.14,<3",
]
dev = ["zbra_py", "numpy>=1.26,<3"]

[tool.hatch.build.targets.wheel]
packages = ["nnue"]

[tool.ruff]
line-length = 100
src = ["nnue", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.workspace]
members = ["crates/zbra_dev", "crates/zbra_py"]

[tool.uv.sources]
zbra-dev = { workspace = true }
zbra-py = { workspace = true }
